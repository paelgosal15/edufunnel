<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EduFunnel Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070d1f;--card:#111a33;--line:#243056;--txt:#e6ebf8;--mut:#93a0c4;--pri:#3b82f6;--bad:#ef4444;--ok:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line)}
header b{font-size:18px}main{padding:24px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
input,select,textarea{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#0b1430;color:var(--txt);font:inherit}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--pri);color:#fff;font:inherit}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}button.del{background:var(--bad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:transparent;border:1px solid var(--line);color:var(--mut)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase}td.act{display:flex;gap:6px}
#msg{margin-bottom:12px;min-height:20px}.err{color:var(--bad)}.ok{color:var(--ok)}
.login{max-width:380px;margin:60px auto}dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;width:min(520px,92vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6)}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.hide{display:none}
</style>
</head>
<body>
<header><b>EduFunnel Admin</b><div><span id="who" class="hide"></span> <button class="ghost hide" id="out">Logout</button> <a href="index.html" style="color:var(--mut);margin-left:8px">Dashboard</a></div></header>
<main>
  <div id="msg"></div>
  <section id="login" class="card login hide">
    <h2 style="margin-top:0">Login Admin</h2>
    <label>Email</label><input id="em" type="email" autocomplete="username" />
    <label>Password</label><input id="pw" type="password" autocomplete="current-password" />
    <div class="row"><button id="go">Masuk</button></div>
  </section>
  <section id="panel" class="hide">
    <div class="tabs" id="tabs"></div>
    <div class="card"><div class="bar"><h3 id="ttl" style="margin:0"></h3><button id="add">+ Tambah data</button></div><div class="wrap"><table id="tbl"></table></div></div>
  </section>
</main>
<dialog id="dlg"><form method="dialog" id="frm"><h3 id="dt" style="margin-top:0"></h3><div id="fields"></div>
<div class="row"><button type="button" class="ghost" id="cancel">Batal</button><button type="submit">Simpan</button></div></form></dialog>
<script>
const SUPABASE_URL = "https://llwouyvyxxmdkydzspeh.supabase.co";
const SUPABASE_KEY = "sb_publishable_tnJhcv4dBQvRJ2iEhrE8sQ_INzR8W2e";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const N = ["pengunjung","daftar","test","daftar_ulang","berkuliah"].map(k => [k, "int"]);
const TABLES = {
  funnel_sources: { label: "Funnel Sources", order: "id", cols: [["period","text"],["name","text"],...N,["ranking","int"],["status","text"]],
    prep(r){ const v=r.pengunjung||0; r.conversion_rate=v?+(r.berkuliah/v*100).toFixed(2):0; r.drop_off=+(100-r.conversion_rate).toFixed(2); } },
  daily_channel_traffic: { label: "Traffic Harian", order: "date", desc: true, cols: [["date","date"],["channel","text"],...N] },
  monthly_channel_traffic: { label: "Traffic Bulanan", order: "month_order", cols: [["period","text"],["month_order","int"],["month","text"],["google_ads","int"],["instagram","int"],["twitter_x","int"],["website","int"]] },
  summary_metrics: { label: "Ringkasan", order: "id", cols: [["project_name","text"],["period","text"],["generated_by","text"],["total_pengunjung","int"],["total_daftar","int"],["total_test","int"],["total_daftar_ulang","int"],["total_berkuliah","int"],["funnel_stages","json"],["funnel_data","json"]] }
};
let cur = "funnel_sources", rows = [], editId = null;
function msg(t, c) { const m = $("msg"); m.textContent = t || ""; m.className = c || ""; }
function show(id, on) { $(id).classList.toggle("hide", !on); }
async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { show("login", true); show("panel", false); return; }
  const uid = data.session.user.id;
  const { data: adm, error } = await sb.from("admin_users").select("user_id").eq("user_id", uid).maybeSingle();
  if (error || !adm) { show("login", false); show("panel", false); msg("Akses ditolak: akun ini bukan admin.", "err"); show("out", true); return; }
  $("who").textContent = data.session.user.email; show("who", true); show("out", true); show("login", false); show("panel", true); msg("");
  $("tabs").innerHTML = ""; Object.keys(TABLES).forEach(k => { const b = document.createElement("button"); b.textContent = TABLES[k].label; b.dataset.k = k; b.onclick = () => { cur = k; load(); }; $("tabs").appendChild(b); });
  load();
}
async function load() {
  const T = TABLES[cur]; $("ttl").textContent = T.label;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.k === cur));
  const { data, error } = await sb.from(cur).select("*").order(T.order, { ascending: !T.desc }).limit(500);
  if (error) { msg("Gagal memuat: " + error.message, "err"); return; }
  rows = data; const t = $("tbl"); t.innerHTML = "";
  const hr = t.insertRow(); ["id", ...T.cols.map(c => c[0]), ""].forEach(h => { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); });
  rows.forEach(r => {
    const tr = t.insertRow();
    ["id", ...T.cols.map(c => c[0])].forEach(k => { const v = r[k]; tr.insertCell().textContent = v !== null && typeof v === "object" ? JSON.stringify(v) : (v ?? ""); });
    const a = tr.insertCell(); a.className = "act";
    const e = document.createElement("button"); e.className = "ghost"; e.textContent = "Edit"; e.onclick = () => openForm(r);
    const d = document.createElement("button"); d.className = "del"; d.textContent = "Hapus"; d.onclick = () => del(r);
    a.append(e, d);
  });
  if (!rows.length) msg("Tabel kosong.");
}
function openForm(r) {
  const T = TABLES[cur]; editId = r ? r.id : null; $("dt").textContent = (r ? "Edit" : "Tambah") + " - " + T.label; $("fields").innerHTML = "";
  T.cols.forEach(([k, type]) => {
    const l = document.createElement("label"); l.textContent = k; const i = document.createElement(type === "json" ? "textarea" : "input");
    if (type === "int") i.type = "number"; if (type === "date") i.type = "date"; if (type === "json") i.rows = 3;
    i.name = k; i.required = true; const v = r ? r[k] : ""; i.value = type === "json" && r ? JSON.stringify(v) : (v ?? "");
    $("fields").append(l, i);
  });
  $("dlg").showModal();
}
$("frm").onsubmit = async ev => {
  ev.preventDefault(); const T = TABLES[cur], p = {};
  try {
    T.cols.forEach(([k, type]) => { const v = $("fields").querySelector('[name="' + k + '"]').value; p[k] = type === "int" ? parseInt(v, 10) : type === "json" ? JSON.parse(v) : v.trim(); });
  } catch (e) { msg("Format JSON tidak valid.", "err"); return; }
  if (T.prep) T.prep(p);
  const q = editId ? sb.from(cur).update(p).eq("id", editId) : sb.from(cur).insert(p);
  const { error } = await q;
  if (error) { msg("Gagal menyimpan: " + error.message, "err"); return; }
  $("dlg").close(); msg("Tersimpan.", "ok"); load();
};
async function del(r) {
  if (!confirm("Hapus baris id " + r.id + "? Tindakan ini tidak bisa dibatalkan.")) return;
  const { error } = await sb.from(cur).delete().eq("id", r.id);
  if (error) { msg("Gagal menghapus: " + error.message, "err"); return; }
  msg("Terhapus.", "ok"); load();
}
$("add").onclick = () => openForm(null);
$("cancel").onclick = () => $("dlg").close();
$("go").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) { msg("Login gagal: " + error.message, "err"); return; }
  boot();
};
$("out").onclick = async () => { await sb.auth.signOut(); show("who", false); show("out", false); show("panel", false); msg(""); boot(); };
boot();
</script>
</body>
</html>
